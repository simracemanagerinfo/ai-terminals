name: AI Terminals - Windows x64
on:
  push:
    branches: [main, feature/split-claude-codex]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'installer/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build shared renderer and test keyboard
        shell: pwsh
        working-directory: src/shared/TerminalUi
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          npm run test:keyboard
          if ($LASTEXITCODE -ne 0) { throw 'Keyboard tests failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'xterm renderer build failed' }

      - name: Validate PowerShell entrypoints
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'scripts/Install-AITerminals.ps1',
            'src/claude/Start-ClaudeSession.ps1',
            'src/claude/Notify-ClaudeTurn.ps1',
            'src/codex/Start-CodexSession.ps1',
            'src/codex/Notify-CodexTurn.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $path).Path, [ref]$tokens, [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              throw ("PowerShell syntax error in {0}: {1}" -f $path, ($parseErrors | Out-String))
            }
          }
          Write-Host '[PASS] PowerShell installers and launchers parse successfully'

      - name: Check token statistics and local history
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project tests/UsageSmoke/UsageSmoke.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Token usage parsing failed' }

      - name: Validate both agent launchers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & './tests/ClaudeCli.Tests.ps1'
          & './tests/CodexCli.Tests.ps1'

      - name: Publish portable Claude Terminal
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/claude/ClaudeTerminal.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false --output "$env:GITHUB_WORKSPACE/out/ClaudeTerminal"
          if ($LASTEXITCODE -ne 0) { throw 'Claude Terminal publish failed' }

      - name: Publish portable Codex Terminal
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/codex/CodexTerminal.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false --output "$env:GITHUB_WORKSPACE/out/CodexTerminal"
          if ($LASTEXITCODE -ne 0) { throw 'Codex Terminal publish failed' }

      - name: Verify both independent packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checks = @(
            'out/ClaudeTerminal/ClaudeTerminal.exe',
            'out/ClaudeTerminal/wwwroot/index.html',
            'out/ClaudeTerminal/scripts/Start-ClaudeSession.ps1',
            'out/ClaudeTerminal/scripts/Notify-ClaudeTurn.ps1',
            'out/ClaudeTerminal/assets/claude-terminal.png',
            'out/CodexTerminal/CodexTerminal.exe',
            'out/CodexTerminal/wwwroot/index.html',
            'out/CodexTerminal/scripts/Start-CodexSession.ps1',
            'out/CodexTerminal/scripts/Notify-CodexTurn.ps1',
            'out/CodexTerminal/assets/codex-terminal.png'
          )
          foreach ($entry in $checks) {
            if (!(Test-Path -LiteralPath $entry -PathType Leaf)) { throw "Missing build output: $entry" }
          }
          Write-Host '[PASS] Two distinct portable Windows apps with independent brands'

      - name: Build standalone Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe",
            "$env:ProgramFiles\\Inno Setup 6\\ISCC.exe",
            "${env:ProgramFiles(x86)}\\Inno Setup 7\\ISCC.exe",
            "$env:ProgramFiles\\Inno Setup 7\\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --version=6.7.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
            $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
              Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe compiler not available' }
          & $iscc '/Qp' 'installer/AI-Terminals.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          $setup = 'out/installer/AI-Terminals-Setup.exe'
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw 'Standalone setup executable missing'
          }
          if ((Get-Item -LiteralPath $setup).Length -lt 10MB) {
            throw 'Installer unusually small'
          }

      - name: Test unattended per-user installation and data preservation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appRoot = Join-Path $env:LOCALAPPDATA 'PowerShellCustomization'
          New-Item -ItemType Directory -Force -Path $appRoot | Out-Null
          $metadata = @{
            'ai-terminals-claude-folders.json' = '{"Version":1,"Projects":{}}'
            'ai-terminals-codex-folders.json' = '{"Version":1,"Projects":{}}'
            'ai-terminals-language.json' = '{"Version":1,"Language":"it"}'
          }
          foreach ($name in $metadata.Keys) {
            Set-Content -LiteralPath (Join-Path $appRoot $name) -Value $metadata[$name] -Encoding utf8
          }
          $setup = (Resolve-Path -LiteralPath 'out/installer/AI-Terminals-Setup.exe').Path
          $process = Start-Process -FilePath $setup -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
            '/COMPONENTS=claude,codex'
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exit code: $($process.ExitCode)" }
          foreach ($agent in @('Claude','Codex')) {
            $exe = Join-Path $appRoot "$($agent)Terminal/$($agent)Terminal.exe"
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw "Installed executable missing: $exe"
            }
          }
          foreach ($name in $metadata.Keys) {
            $path = Join-Path $appRoot $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or
                (Get-Content -LiteralPath $path -Raw).Trim() -ne $metadata[$name]) {
              throw "Installer unexpectedly changed local UI metadata: $name"
            }
          }
          Write-Host '[PASS] Both app executables installed; saved folders and language preserved'
          $uninstaller = Join-Path $appRoot 'unins000.exe'
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            throw 'Per-user uninstaller missing'
          }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall exit code: $($uninstall.ExitCode)" }
          foreach ($name in $metadata.Keys) {
            $path = Join-Path $appRoot $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or
                (Get-Content -LiteralPath $path -Raw).Trim() -ne $metadata[$name]) {
              throw "Uninstall unexpectedly erased user metadata: $name"
            }
          }
          Write-Host '[PASS] Uninstall leaves saved folders and UI language untouched'

      - name: Test two live ConPTY sessions (headless runner advisory)
        id: conpty_smoke
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project tests/ConPtySmoke/ConPtySmoke.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Headless ConPTY smoke failed' }

      - name: Report headless ConPTY limitations
        if: always()
        shell: pwsh
        env:
          CONPTY_OUTCOME: ${{ steps.conpty_smoke.outcome }}
        run: |
          if ($env:CONPTY_OUTCOME -eq 'failure') {
            Add-Content $env:GITHUB_STEP_SUMMARY 'ConPTY smoke failed on headless runner: interactive desktop QA still required.'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeTerminal-win-x64
          path: out/ClaudeTerminal/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: CodexTerminal-win-x64
          path: out/CodexTerminal/
          if-no-files-found: error
          retention-days: 14
      
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Terminals-Setup
          path: out/installer/AI-Terminals-Setup.exe
          if-no-files-found: error
          retention-days: 14
