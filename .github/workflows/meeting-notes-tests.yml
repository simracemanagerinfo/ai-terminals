name: Meeting Notes - PowerShell MVP tests
on:
  push:
    branches: [feature/meeting-notes]
    paths:
      - 'scripts/meetings/**'
      - 'tests/MeetingMinutes.Tests.ps1'
      - '.github/workflows/meeting-notes-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meeting-notes:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'scripts/meetings/Invoke-MeetingMinutes.ps1',
            'scripts/meetings/Invoke-MeetingProvider.ps1',
            'tests/MeetingMinutes.Tests.ps1'
          )
          foreach ($path in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              throw ("Syntax error in {0}: {1}" -f $path, ($errors | Out-String))
            }
          }
          Write-Host '[PASS] PowerShell parsing completed'
      - name: Run offline meeting tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & './tests/MeetingMinutes.Tests.ps1'
