name: Meeting Notes - PowerShell MVP tests
on:
  push:
    branches: [feature/meeting-notes]
    paths:
      - 'scripts/meetings/**'
      - 'src/meetings/**'
      - 'tests/MeetingMinutes.Tests.ps1'
      - 'tests/MeetingNotesSmoke/**'
      - '.github/workflows/meeting-notes-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  meeting-notes:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'scripts/meetings/Invoke-MeetingMinutes.ps1',
            'scripts/meetings/Invoke-MeetingProvider.ps1',
            'scripts/meetings/Install-MeetingNotes.ps1',
            'scripts/meetings/Install-WhisperModel.ps1',
            'scripts/meetings/New-MeetingNotesIcon.ps1',
            'tests/MeetingMinutes.Tests.ps1'
          )
          foreach ($path in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              throw ("Syntax error in {0}: {1}" -f $path, ($errors | Out-String))
            }
          }
          Write-Host '[PASS] PowerShell parsing completed'
      - name: Run offline meeting tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & './tests/MeetingMinutes.Tests.ps1'
      - name: Build independent MeetingNotes Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/meetings/MeetingNotes.csproj --configuration Release --runtime win-x64 --self-contained true --output "$env:GITHUB_WORKSPACE/out/MeetingNotes"
          if ($LASTEXITCODE -ne 0) { throw 'Meeting Notes publish failed' }
          foreach ($file in @(
            'MeetingNotes.exe',
            'scripts/Invoke-MeetingMinutes.ps1',
            'scripts/Invoke-MeetingProvider.ps1'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path 'out/MeetingNotes' $file))) {
              throw "Missing Meeting Notes artifact: $file"
            }
          }
      - name: Verify native Windows application icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'src/meetings/Resources/MeetingNotes.ico'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw 'Generated ICO missing.' }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $source).Path)
          if ($bytes.Length -lt 400 -or $bytes[2] -ne 1 -or $bytes[4] -ne 1) {
            throw 'Generated Windows ICO header invalid.'
          }
          Add-Type -AssemblyName System.Drawing
          $icon = [Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path 'out/MeetingNotes/MeetingNotes.exe').Path)
          if ($null -eq $icon -or $icon.Width -lt 16) { throw 'Executable icon not embedded.' }
          Write-Host '[PASS] Embedded Windows executable icon available.'
          $icon.Dispose()
      - name: Publish offline CPU Whisper transcriber
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/meetings/transcriber/MeetingTranscriber.csproj --configuration Release --runtime win-x64 --self-contained true --output "$env:GITHUB_WORKSPACE/out/MeetingNotes/transcriber"
          if ($LASTEXITCODE -ne 0) { throw 'Offline transcriber publish failed' }
          if (-not (Test-Path -LiteralPath 'out/MeetingNotes/transcriber/MeetingTranscriber.exe' -PathType Leaf)) {
            throw 'Offline transcriber executable not present.'
          }
          & './out/MeetingNotes/transcriber/MeetingTranscriber.exe' --self-test
          if ($LASTEXITCODE -ne 0) { throw 'WAV resampler test failed.' }
          if (-not (Test-Path -LiteralPath 'out/MeetingNotes/transcriber/Whisper.net.dll' -PathType Leaf)) { throw 'Missing Whisper.net in standalone package' }
      - name: Validate HTML clipboard offsets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project tests/MeetingNotesSmoke/MeetingNotesSmoke.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'HTML clipboard smoke failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingNotes-win-x64
          path: out/MeetingNotes/
          if-no-files-found: error
          retention-days: 14
      - name: Smoke test installer via GitHub API without gh
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          & './scripts/meetings/Install-MeetingNotes.ps1' -Destination "$env:GITHUB_WORKSPACE/out/MeetingNotesInstallerSmoke" -RunId ([long]$env:GITHUB_RUN_ID)
          if (-not (Test-Path -LiteralPath 'out/MeetingNotesInstallerSmoke/MeetingNotes.exe' -PathType Leaf)) {
            throw 'Installer did not restore MeetingNotes.exe'
          }
          Write-Host '[PASS] Installer downloads Actions artifact without gh CLI.'
