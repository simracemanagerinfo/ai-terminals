name: Publish AI Terminals v1.1.2

on:
  workflow_run:
    workflows: ["AI Terminals - Windows x64"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exactly the tested source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Check whether this version is already published
        id: publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'User-Agent' = 'AI-Terminals-Release'
          }
          $exists = $false
          try {
            $published = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/v1.1.2" -Headers $headers -TimeoutSec 30
            if ($published.draft) { throw 'Release v1.1.2 exists as a draft: manual review required' }
            $exists = $true
          }
          catch {
            if ($null -eq $_.Exception.Response -or
                [int]$_.Exception.Response.StatusCode -ne 404) { throw }
          }
          if ($exists) {
            Write-Host 'v1.1.2 already published: do not attempt to recreate an existing immutable release.'
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Download Claude Terminal from successful Windows build
        if: steps.publication.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ClaudeTerminal-win-x64
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: packages/ClaudeTerminal

      - name: Download Codex Terminal from the same Windows build
        if: steps.publication.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: CodexTerminal-win-x64
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: packages/CodexTerminal

      - name: Download installer from same successful Windows build
        if: steps.publication.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: AI-Terminals-Setup
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: packages/Installer

      - name: Verify checked-out release versions
        if: steps.publication.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($project in @('src/claude/ClaudeTerminal.csproj', 'src/codex/CodexTerminal.csproj')) {
            [xml]$xml = Get-Content -LiteralPath $project -Raw
            if ($xml.Project.PropertyGroup.Version -ne '1.1.2') {
              throw "Unexpected version for ${project}: $($xml.Project.PropertyGroup.Version)"
            }
          }

      - name: Verify packages and create versioned ZIP and checksums
        if: steps.publication.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $checksums = @()
          foreach ($agent in @('Claude', 'Codex')) {
            $source = Join-Path 'packages' "$($agent)Terminal"
            $required = @(
              "$($agent)Terminal.exe",
              'wwwroot/index.html',
              "scripts/Start-$($agent)Session.ps1",
              "assets/$($agent.ToLowerInvariant())-terminal.png"
            )
            $required += "scripts/Notify-$($agent)Turn.ps1"
            foreach ($relative in $required) {
              $check = Join-Path $source $relative
              if (-not (Test-Path -LiteralPath $check -PathType Leaf)) {
                throw "Missing required release file: $check"
              }
            }

            $archive = Join-Path 'release-assets' "$($agent)Terminal-win-x64.zip"
            Compress-Archive -Path (Join-Path $source '*') -DestinationPath $archive -CompressionLevel Optimal -Force
            if ((Get-Item -LiteralPath $archive).Length -lt 1MB) {
              throw "Unusually small release package: $archive"
            }
            $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            $checksums += "$digest  $([IO.Path]::GetFileName($archive))"
            Write-Host "[OK] $archive SHA256 $digest"
          }
          $setup = 'packages/Installer/AI-Terminals-Setup.exe'
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw 'Missing tested Windows installer artifact'
          }
          if ((Get-Item -LiteralPath $setup).Length -lt 10MB) {
            throw 'Windows installer unexpectedly small'
          }
          $dest = 'release-assets/AI-Terminals-Setup.exe'
          Copy-Item -LiteralPath $setup -Destination $dest
          $digest = (Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksums += "$digest  AI-Terminals-Setup.exe"
          $checksums | Set-Content -LiteralPath 'release-assets/SHA256SUMS.txt' -Encoding ascii

      - name: Publish stable GitHub Release v1.1.2
        if: steps.publication.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create v1.1.2 'release-assets/AI-Terminals-Setup.exe' 'release-assets/ClaudeTerminal-win-x64.zip' 'release-assets/CodexTerminal-win-x64.zip' 'release-assets/SHA256SUMS.txt' --repo $env:GITHUB_REPOSITORY --target $env:TESTED_SHA --title 'AI Terminals v1.1.2' --notes-file 'docs/releases/v1.1.2.md' --latest
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publication failed ($LASTEXITCODE)"
          }
